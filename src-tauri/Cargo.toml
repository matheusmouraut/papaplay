[package]
name = "papaplay"
version = "0.1.0"
description = "Overlay que transforma jogos em aprendizado de ingles"
authors = ["PapaPlay"]
edition = "2021"
# Com mais de um binario no pacote (ocr-spike, capture-probe) o `cargo run` que
# o `tauri dev` dispara fica ambiguo e o app nao sobe.
default-run = "papaplay"
# Os binarios sao declarados um a um abaixo. Com a descoberta automatica ligada,
# tudo em `src/bin/` vira alvo padrao — e o bundler do Tauri empacota **todos**
# os alvos `bin` do pacote no instalador. Foi assim que o `capture-probe.exe`
# (23 MB de ONNX estatico) entrou num instalador de 35 MB.
autobins = false

[features]
default = []
# Ferramentas de diagnostico que sobraram das spikes: medem latencia de captura,
# de OCR e de traducao. Uteis para conferir regressao, mas nao sao produto.
#
#   cargo run --release --features spikes --bin ocr-spike -- --repeticoes 5
spikes = []

[[bin]]
name = "papaplay"
path = "src/main.rs"

[[bin]]
name = "capture-probe"
path = "src/bin/capture-probe.rs"
required-features = ["spikes"]

[[bin]]
name = "ocr-spike"
path = "src/bin/ocr-spike.rs"
required-features = ["spikes"]

[[bin]]
name = "nmt-probe"
path = "src/bin/nmt-probe.rs"
required-features = ["spikes"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "papaplay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Sem isto, `tauri dev` roda o OCR a opt-level 0 e o app parece lento por um
# motivo que nao existe em producao. Medido em 2026-08-01 com o `ocr-spike`
# numa regiao de 1200x420 (a mesma da espiada):
#
#   debug puro   media 354 ms, pior 580 ms, deteccao 255 ms
#   release      media 104 ms, pior 278 ms, deteccao  38 ms
#
# A inferencia ONNX e nativa e nao muda; o que custa e o nosso pre/pos
# processamento (conversao de cor, resize, binarizacao, CTC) e o crate `image`.
[profile.dev]
# 1 e o joelho da curva: pega a maior parte do ganho sem transformar cada
# recompilacao do nosso codigo numa espera.
opt-level = 1

# Desligado porque `opt-level = 1` + compilacao incremental quebra o link neste
# alvo (x86_64-pc-windows-msvc): o build falha com dezenas de
# `LNK2019: simbolo externo nao resolvido, anon.<hash>.llvm.<hash>`, referentes
# a codigo do serde_json que nao mudou. Aconteceu duas vezes em 2026-08-01, e
# das duas so `cargo clean -p papaplay` resolveu.
#
# O custo e recompilar a crate inteira a cada mudanca (~25 s). E menos do que
# perder tempo diagnosticando um erro de linker que parece corrupcao de codigo
# e nao e.
incremental = false

[profile.dev.package."*"]
# Dependencias sao compiladas uma vez e reusadas — aqui otimizar e de graca.
opt-level = 3

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# OCR (spike 02). `ort` nao tem release estavel — 2.0.0-rc.13 e a versao usada
# em producao pela comunidade. Pinada em `=` de proposito: as rc mudam a API
# entre si e um bump silencioso quebraria o build.
# `bundled` compila o SQLite junto: sem isso o build depende de uma lib do
# sistema, que no Windows não existe por padrão.
rusqlite = { version = "0.40", features = ["bundled"] }

ort = "=2.0.0-rc.13"

# Download do tradutor no primeiro uso (setup, nunca em runtime — regra 2 do
# CLAUDE.md). `rustls-tls` em vez do TLS do sistema: uma raiz de confianca so,
# igual em qualquer maquina. `blocking` porque o download roda na sua propria
# thread e le em pedacos para reportar progresso — um stream assincrono nao
# tornaria isso mais simples.
reqwest = { version = "0.12", default-features = false, features = [
  "blocking",
  "rustls-tls",
] }
# Verificacao do arquivo baixado. Download truncado por queda de rede e o modo
# de falha comum, e um .onnx pela metade so falha muito depois, no carregamento.
sha2 = "0.10"

# Tokenizador do tradutor. `default-features = false` tira o oniguruma (C) e a
# barra de progresso: o Marian usa Unigram + Metaspace, que sao Rust puro.
# O `fancy-regex` nao e opcional — a crate exige um backend de regex e este e o
# que dispensa o oniguruma.
tokenizers = { version = "0.22", default-features = false, features = [
  "fancy-regex",
] }

# O `webp` e o formato dos screenshots dos contextos (docs/04). O encoder do
# `image` e Rust puro e so faz lossless — o suficiente para um recorte de uma
# linha de texto, e evita arrastar o libwebp (C) para o build.
image = { version = "0.25", default-features = false, features = [
  "png",
  "jpeg",
  "webp",
] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
# Dialogo nativo de "salvar como" do export CSV (F4). O core escreve o arquivo;
# o plugin so devolve o caminho que o usuario escolheu.
tauri-plugin-dialog = "2"

# Monitor da janela em foco, captura de tela e restauracao de foco ao sair do
# modo lookup. Apenas leitura de estado de janelas alheias e Windows Graphics
# Capture — nunca injecao nem hook (ver CLAUDE.md, regra 1).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Foundation",
  "Graphics_Capture",
  "Graphics_DirectX_Direct3D11",
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  # Working set do processo: e assim que o capture-probe mede quanto o runtime
  # ONNX custa de RAM (divida aberta pela spike 01).
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
  "Win32_System_WinRT_Direct3D11",
  "Win32_System_WinRT_Graphics_Capture",
  "Win32_UI_HiDpi",
  # Leitura do estado do botao do mouse enquanto a espiada esta ativa
  # (GetAsyncKeyState). Leitura de estado global, nunca hook.
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }
