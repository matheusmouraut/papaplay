[package]
name = "papaplay"
version = "0.1.0"
description = "Overlay que transforma jogos em aprendizado de ingles"
authors = ["PapaPlay"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "papaplay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# OCR (spike 02). `ort` nao tem release estavel — 2.0.0-rc.13 e a versao usada
# em producao pela comunidade. Pinada em `=` de proposito: as rc mudam a API
# entre si e um bump silencioso quebraria o build.
ort = "=2.0.0-rc.13"
image = { version = "0.25", default-features = false, features = [
  "png",
  "jpeg",
] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"

# Monitor da janela em foco, captura de tela e restauracao de foco ao sair do
# modo lookup. Apenas leitura de estado de janelas alheias e Windows Graphics
# Capture — nunca injecao nem hook (ver CLAUDE.md, regra 1).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Foundation",
  "Graphics_Capture",
  "Graphics_DirectX_Direct3D11",
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  # Working set do processo: e assim que o capture-probe mede quanto o runtime
  # ONNX custa de RAM (divida aberta pela spike 01).
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
  "Win32_System_WinRT_Direct3D11",
  "Win32_System_WinRT_Graphics_Capture",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
] }
